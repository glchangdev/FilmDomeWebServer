<head th:fragment="head" xmlns:th="http://www.w3.org/1999/xhtml">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Film Dome</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/user-login-signup-style.css">
    <link rel="stylesheet" href="/css/movie-app.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<nav th:fragment="nav" class="navbar navbar-expand-md navbar-dark" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div th:if="${session.user != null}">
            <div th:if="${session.user.id != -1}">
                <a th:href="@{/displayUserInfo}" class="text-white fs-5 fw-bold text-decoration-none" th:text="${session.user.firstName + ' ' + session.user.lastName}"></a>
            </div>
            <div th:unless="${session.user.id != -1}">
                <span class="text-white fs-5 fw-bold">Guest</span>
            </div>
        </div>
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link text-white fs-3 fw-bold" th:href="@{/displayHomePage}">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white fs-3 fw-bold" th:href="@{/newsPage}">News</a></li>
                <li><a class="nav-link text-white fs-3 fw-bold" th:href="@{/displaySearchPage}">Search</a></li>
                <li th:if="${session.user != null}"><a class="nav-link text-white fs-3 fw-bold" th:href="@{/sessionEndLogout}">Sign Out</a></li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="foot" class="fixed-bottom py-2 text-end pe-5 fs-5 text-white fw-bold" style="background-color: rgba(63, 81, 181);" xmlns:th="http://www.w3.org/1999/xhtml">
    © 2026 Film Dome, Inc

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</footer>
