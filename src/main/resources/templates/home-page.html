<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/pageLayout :: head}"></div>
<body>
<div th:replace="~{fragments/pageLayout :: nav}"></div>
<div class="container bg-light pb-5 mb-5">
    <div class="container pt-4">
        <h2 class="text-center mb-3 fw-bold display-4">Trending Now</h2>
        <div class="row g-3">
            <div th:each="movie : ${trendingMovies}" class="col-6 col-sm-4 col-md-3 col-lg-2">
                    <a th:href="@{'/displayMovieInfo?id=' + ${movie.id}}">
                        <img class="movieImage" th:src="@{'https://image.tmdb.org/t/p/w500' + ${movie.poster}}" th:alt="${movie.name}">
                    </a>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <h2 class="text-center mb-3 mt-4 fw-bold display-4">Newest Films</h2>
        <div class="row g-3">
            <div th:each="movie : ${newestMovies}" class="col-6 col-sm-4 col-md-3 col-lg-2">
                    <a th:href="@{'/displayMovieInfo?id=' + ${movie.id}}">
                        <img class="movieImage" th:src="@{'https://image.tmdb.org/t/p/w500' + ${movie.poster}}" th:alt="${movie.name}">
                    </a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/pageLayout :: foot}"></div>
</body>
</html>
